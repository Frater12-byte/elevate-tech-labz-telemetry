# AI token usage across every project and user (Claude API, Claude Code, OpenAI/Codex) -> telemetry.json
name: token-telemetry
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keys come from Azure Key Vault (if AZURE_CLIENT_ID is set) or from repo secrets.
      - if: ${{ vars.AZURE_CLIENT_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - if: ${{ vars.AZURE_CLIENT_ID != '' }}
        name: Read keys from Key Vault
        run: |
          for pair in ANTHROPIC_ADMIN_KEY=anthropic-admin-key OPENAI_ADMIN_KEY=openai-admin-key; do
            name="${pair%%=*}"; secret="${pair##*=}"
            value=$(az keyvault secret show --vault-name "${{ vars.KEY_VAULT_NAME }}" --name "$secret" --query value -o tsv 2>/dev/null || true)
            if [ -n "$value" ]; then echo "::add-mask::$value"; echo "$name=$value" >> "$GITHUB_ENV"; fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build telemetry.json
        env:
          SECRET_ANTHROPIC_ADMIN_KEY: ${{ secrets.ANTHROPIC_ADMIN_KEY }}
          SECRET_OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
          TELEMETRY_SINCE: ${{ vars.TELEMETRY_SINCE }}
        run: node scripts/telemetry.mjs > telemetry.json.tmp && mv telemetry.json.tmp telemetry.json
      - name: Commit
        run: |
          git config user.name "telemetry-bot"; git config user.email "telemetry-bot@users.noreply.github.com"
          git add telemetry.json state.json
          git diff --cached --quiet || git commit -m "telemetry $(date -u +%FT%TZ)"
          git pull --rebase --quiet || true
          git push
